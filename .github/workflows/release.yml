name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/kbwall" staging/kbwall
          chmod +x staging/kbwall
          cp LICENSE README.md SECURITY.md staging/
          cp examples/kb.example.toml staging/kb.example.toml
          tar -C staging -czf "dist/kbwall-${{ matrix.target }}.tar.gz" .
          ls -lh "dist/kbwall-${{ matrix.target }}.tar.gz"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\kbwall.exe" "staging\kbwall.exe"
          Copy-Item LICENSE, README.md, SECURITY.md "staging\"
          Copy-Item "examples\kb.example.toml" "staging\kb.example.toml"
          Compress-Archive -Path "staging\*" -DestinationPath "dist\kbwall-${{ matrix.target }}.zip" -Force
          Get-Item "dist\kbwall-${{ matrix.target }}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: kbwall-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum kbwall-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "kbwall $TAG" \
            --generate-notes
