[package]
name = "kbwall"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "~1 MB, air-gapped, read-only Rust MCP firewall for XERJ and Elasticsearch-compatible local knowledge bases — multilingual out of the box with offline CJK enhancement."
repository = "https://github.com/wasabihu/kbwall"
readme = "README.md"
keywords = ["mcp", "search", "xerj", "elasticsearch", "knowledge-base"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "kbwall"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"
let_underscore_must_use = "deny"
indexing_slicing = "warn"
use_self = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

[profile.ci-test]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
